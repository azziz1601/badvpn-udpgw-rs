[package]
name = "badvpn-udpgw-rs"
version = "1.2.0"
edition = "2021"
description = "High-performance Rust rewrite of badvpn-udpgw (audited & hardened for 1-vCPU and multi-core VPS)"
license = "BSD-3-Clause"

[[bin]]
name = "badvpn-udpgw"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
socket2 = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
