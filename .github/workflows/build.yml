name: Build & Test badvpn-udpgw-rs

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run cargo test
        run: cargo test --verbose

  build-musl:
    name: Build static Linux binary (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            apt_packages: musl-tools
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            linker: musl-gcc
          - target: aarch64-unknown-linux-musl
            arch: arm64
            apt_packages: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: |
          export ${{ matrix.linker_env }}=${{ matrix.linker }}
          cargo build --release --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/badvpn-udpgw

      - name: Package build
        env:
          BIN: badvpn-udpgw-linux-${{ matrix.arch }}
        run: |
          cp target/${{ matrix.target }}/release/badvpn-udpgw "$BIN"
          ./"$BIN" --version
          tar -czf "$BIN.tar.gz" "$BIN" badvpn-udpgw.service README.md
          sha256sum "$BIN" "$BIN.tar.gz" > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: badvpn-udpgw-linux-${{ matrix.arch }}
          path: |
            badvpn-udpgw-linux-${{ matrix.arch }}
            badvpn-udpgw-linux-${{ matrix.arch }}.tar.gz
            SHA256SUMS-${{ matrix.arch }}.txt

  build-gnu:
    name: Build glibc x86_64 binary for Debian VPS
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-

      - name: Build release binary
        env:
          RUSTFLAGS: -C target-cpu=x86-64
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          file target/x86_64-unknown-linux-gnu/release/badvpn-udpgw

      - name: Package build
        env:
          BIN: badvpn-udpgw-linux-amd64-gnu
        run: |
          cp target/x86_64-unknown-linux-gnu/release/badvpn-udpgw "$BIN"
          ldd "$BIN"
          ./"$BIN" --version
          tar -czf "$BIN.tar.gz" "$BIN" badvpn-udpgw.service README.md
          sha256sum "$BIN" "$BIN.tar.gz" > SHA256SUMS-amd64-gnu.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: badvpn-udpgw-linux-amd64-gnu
          path: |
            badvpn-udpgw-linux-amd64-gnu
            badvpn-udpgw-linux-amd64-gnu.tar.gz
            SHA256SUMS-amd64-gnu.txt

  release:
    name: Publish GitHub Release
    needs: [build-musl, build-gnu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
